<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160">
  <defs>
    <style>
      .ch-mark   { fill: none; stroke: #C1272D; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .ch-letter { font-family: 'Poppins', Arial, sans-serif; font-weight: 800; fill: #101012; }
      .ch-word   { font-family: 'Poppins', Arial, sans-serif; font-weight: 800; fill: #101012; letter-spacing: 0.5px; }
      .ch-sub    { font-family: 'Inter', Arial, sans-serif; font-weight: 600; fill: #C1272D; letter-spacing: 2.5px; }
      .ch-tool   { fill: none; stroke: #101012; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- House / roof outline mark -->
  <g>
    <path class="ch-mark" d="M14 78 L70 34 L126 78" />
    <path class="ch-mark" d="M30 68 V118 Q30 126 38 126 H102 Q110 126 110 118 V68" />
    <text x="70" y="104" text-anchor="middle" class="ch-letter" font-size="40">CH</text>
    <!-- wrench accent, tucked beside the roof peak -->
    <g transform="translate(112,40) rotate(35)">
      <path d="M-4 -14 a8 8 0 1 1 -1.2 4.1 L-16 3 a3 3 0 0 0 0 4.2 l1.8 1.8 a3 3 0 0 0 4.2 0 l12.3-12.3 A8 8 0 0 1 -4 -14 Z"
            fill="#C1272D" stroke="none"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="150" y="82" class="ch-word" font-size="34">CHAPIN HANDYMAN</text>
  <text x="150" y="112" class="ch-sub" font-size="16">L L C  ·  LICENSED &amp; INSURED</text>
</svg>
